[project]
name = "edinet-xbrl-prep"
version = "0.2.0"
description = "EDINET の有価証券報告書 XBRL を取得し、財務数値・テキストの大福帳（One Big Table）を作る前処理ライブラリ"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"  # 開発は 3.12（.python-version）。Colab（3.13）でも動くことを確認
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "pandera>=0.24",
    "requests>=2.32",
    "lxml>=5",
    "arelle-release>=2.30",
    "tqdm>=4.66",
    "xlrd>=2.0.1",          # 東証の業種区分（.xls）の読み込み
]

[project.optional-dependencies]
# LLM による事業内容の抽出（ノートブック 4.2）
llm = ["groq>=0.13"]
# ノートブックの分析例（トピックモデル・ワードクラウド・主成分分析など）
analysis = [
    "janome>=0.5",
    "gensim>=4.3.3",
    "wordcloud>=1.9.4",
    "matplotlib>=3.9",
    "matplotlib-fontja>=1.0",
    "scikit-learn>=1.5",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edinet_xbrl_prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "target(*names): テスト対象の関数（モジュール.関数）。docs/tests_report.html に使う",
    "network: ネットワークに接続するテスト（既定では実行しない）",
    "fixture_zip: 実際の EDINET 書類の ZIP を使うテスト（環境変数 EDINET_FIXTURE_DIR が必要）",
]
addopts = "-ra --strict-markers -m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pandera は Series[...] | None の注釈を読めないため Optional を使う
"edinet_xbrl_prep/schemas.py" = ["UP007", "UP045"]
